{% extends "base.html" %}
{% block content %}
<h1>Hos geldin, {{ kullanici_adi }}!</h1>
<section class="card">
  <p>Rolun: <strong>{{ rol }}</strong></p>
  {% if rol == "yönetici" %}
  <p class="success">Tebrikler! Yonetici paneline eristin.</p>
  {% endif %}
  <p><a href="{{ url_for('mesajlar') }}">Mesaj panosuna git</a></p>
  <p><a href="{{ url_for('hesap', kid=session['id']) }}">Hesabim</a></p>
  <a href="{{ url_for('cikis') }}">Cikis yap</a>
</section>
{% endblock %}
