{% extends "base.html" %}
{% block content %}
<h1>VulnLab Giris</h1>
<p class="muted">Seviye 1: SQL Injection</p>

<form method="post" class="card" autocomplete="off">
  <label>Kullanici adi
    <input name="kullanici_adi" spellcheck="false" autofocus>
  </label>
  <label>Sifre
    <input name="sifre" type="password">
  </label>
  <button type="submit">Giris yap</button>
  {% if hata %}<p class="error">{{ hata }}</p>{% endif %}
</form>

{% if sorgu %}
<section class="card">
  <h2>SQL monitoru</h2>
  <p class="muted">Sunucunun veritabanina gonderdigi sorgu:</p>
  <pre>{{ sorgu }}</pre>
</section>
{% endif %}
{% endblock %}
